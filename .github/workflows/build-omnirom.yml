name: Build OmniROM 12.1 for H616/H618

on:
  workflow_dispatch:
    inputs:
      device:
        description: 'Device to build for'
        required: true
        default: 'apollo_p3'
        type: choice
        options:
          - apollo_p2
          - apollo_p3
      build_type:
        description: 'Build type'
        required: true
        default: 'eng'
        type: choice
        options:
          - eng
          - userdebug
          - user

env:
  BUILD_DIR: /home/runner/android_build
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    runs-on: ubuntu-20.04
    timeout-minutes: 480
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Maximize build space
        uses: AdityaGarg8/remove-unwanted-software@v4.1
        with:
          remove-android: 'true'
          remove-dotnet: 'true'
          remove-haskell: 'true'

      - name: Add 32-bit architecture support
        run: |
          echo "📦 Adding 32-bit architecture support..."
          sudo dpkg --add-architecture i386
          sudo apt-get update

      - name: Install dependencies
        run: |
          echo "📦 Installing build dependencies..."
          sudo apt-get install -y \
            bc bison build-essential curl flex \
            g++-multilib gcc-multilib git gnupg gperf imagemagick \
            lib32z1-dev liblz4-tool libncurses5-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush rsync schedtool \
            squashfs-tools x11proto-core-dev xsltproc zip zlib1g-dev \
            openjdk-8-jdk python3 repo git-lfs ccache wget
          
          # Try to install optional 32-bit packages
          sudo apt-get install -y lib32ncurses5-dev libtinfo5 2>/dev/null || echo "⚠️  Some 32-bit packages unavailable (OK for ARM64)"
          echo "✅ Dependencies installed"

      - name: Setup Java
        run: |
          sudo update-alternatives --install /usr/bin/java java /usr/lib/jvm/java-8-openjdk-amd64/bin/java 1
          java -version

      - name: Setup directories
        run: |
          mkdir -p ${{ env.BUILD_DIR }}
          mkdir -p ${{ env.CCACHE_DIR }}
          df -h

      - name: Setup repo
        run: |
          mkdir -p ~/.bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/.bin/repo
          chmod a+x ~/.bin/repo
          echo "$HOME/.bin" >> $GITHUB_PATH

      - name: Initialize repo
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          git config --global user.email "bot@github.com"
          git config --global user.name "GitHub Bot"
          ~/.bin/repo init -u https://github.com/omnirom/android.git -b android-12.1 --depth=1 -q

      - name: Add local manifest
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          curl -o .repo/local_manifests/local_manifest.xml -L \
            https://raw.githubusercontent.com/wolfhamad/android_apollo-p2_local_manifest/omni-12.1/local_manifest.xml \
            --create-dirs -s

      - name: Clean manifest
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          if [ -f .repo/manifests/omni-default.xml ]; then
            sed -i '/omni-private/d' .repo/manifests/omni-default.xml
          fi

      - name: Sync repositories
        working-directory: ${{ env.BUILD_DIR }}
        timeout-minutes: 120
        run: |
          ~/.bin/repo sync -j$(nproc --all) --no-clone-bundle -q --force-sync
          du -sh ${{ env.BUILD_DIR }}

      - name: Handle LFS files
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          if [ -d "longan" ]; then
            cd longan
            git lfs pull -q
            cd ..
          fi

      - name: Copy patches
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          mkdir -p patches
          cp ${{ github.workspace }}/.patches/*.patch patches/ 2>/dev/null || true

      - name: Apply U-Boot patches
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          UBOOT_DIR=$(find . -type d -name "u-boot-*" 2>/dev/null | head -1)
          
          if [ -z "$UBOOT_DIR" ]; then
            echo "U-Boot directory not found, skipping patches"
            exit 0
          fi
          
          cd "$UBOOT_DIR"
          
          [ -f "../../patches/174-define-DRAM_MAX_SIZE-to-4GB.patch" ] && patch -p1 --no-backup-if-mismatch < "../../patches/174-define-DRAM_MAX_SIZE-to-4GB.patch" || true
          [ -f "../../patches/configs-Transpeed-8K618-T-Add-Transpeed-Secure-Boot.patch" ] && patch -p1 --no-backup-if-mismatch < "../../patches/configs-Transpeed-8K618-T-Add-Transpeed-Secure-Boot.patch" || true

      - name: Setup ccache
        run: |
          ccache -M 15G 2>/dev/null || true
          ccache -z 2>/dev/null || true

      - name: Build OmniROM
        working-directory: ${{ env.BUILD_DIR }}
        timeout-minutes: 300
        run: |
          export USE_CCACHE=1 CCACHE_COMPRESS=1 CCACHE_DIR=${{ env.CCACHE_DIR }}
          
          source build/envsetup.sh
          lunch omni_${{ github.event.inputs.device }}-${{ github.event.inputs.build_type }}
          
          mka -j$(nproc --all) bacon 2>&1 | tee build.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omnirom-12.1-${{ github.event.inputs.device }}-${{ github.event.inputs.build_type }}-run${{ github.run_number }}
          path: |
            ${{ env.BUILD_DIR }}/out/target/product/${{ github.event.inputs.device }}/*.zip
            ${{ env.BUILD_DIR }}/build.log
          retention-days: 30
          if-no-files-found: warn
